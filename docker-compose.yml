version: '3.8'

services:
  php81-apache:
    image: php:8.1-apache
    container_name: php81-apache
    environment:
      - DB_DATABASE=testing
      - DB_USERNAME=testing
      - DB_PASSWORD=testing
      - APP_KEY=deela5kinohw0haekoothahSh8eexach
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mariadb
      - pgsql

  php81-nginx:
    image: php:8.1-fpm
    container_name: php81-nginx
    environment:
      - DB_DATABASE=testing
      - DB_USERNAME=testing
      - DB_PASSWORD=testing
      - APP_KEY=deela5kinohw0haekoothahSh8eexach
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mariadb
      - pgsql

  php82-apache:
    image: php:8.2-apache
    container_name: php82-apache
    environment:
      - DB_DATABASE=testing
      - DB_USERNAME=testing
      - DB_PASSWORD=testing
      - APP_KEY=deela5kinohw0haekoothahSh8eexach
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mariadb
      - pgsql

  php82-nginx:
    image: php:8.2-fpm
    container_name: php82-nginx
    environment:
      - DB_DATABASE=testing
      - DB_USERNAME=testing
      - DB_PASSWORD=testing
      - APP_KEY=deela5kinohw0haekoothahSh8eexach
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mariadb
      - pgsql

  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      - MYSQL_DATABASE=testing
      - MYSQL_USER=testing
      - MYSQL_PASSWORD=testing
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql-data:/var/lib/mysql

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      - MYSQL_DATABASE=testing
      - MYSQL_USER=testing
      - MYSQL_PASSWORD=testing
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_ROOT_HOST=%
    volumes:
      - mariadb-data:/var/lib/mysql

  pgsql:
    image: postgres:14
    container_name: pgsql
    environment:
      - POSTGRES_DB=testing
      - POSTGRES_USER=testing
      - POSTGRES_PASSWORD=testing
    volumes:
      - pgsql-data:/var/lib/postgresql/data

volumes:
  mysql-data:
  mariadb-data:
  pgsql-data:
