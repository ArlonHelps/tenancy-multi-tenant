          docker exec php82-nginx mysql --host=mariadb -e "grant all privileges on *.* to 'testing'@'%' with grant option;"
          docker exec php82-nginx PGPASSWORD=testing psql --host=pgsql --username=testing -c "GRANT ALL ON SCHEMA public TO testing;"
          docker exec php82-nginx DB_CONNECTION=mysql DB_HOST=mysql TENANCY_SYSTEM_CONNECTION_NAME=mysql ./vendor/bin/phpunit -c ci.phpunit.xml
          docker exec php82-nginx DB_CONNECTION=mysql DB_HOST=mariadb LIMIT_UUID_LENGTH_32=1 TENANCY_SYSTEM_CONNECTION_NAME=mysql ./vendor/bin/phpunit -c ci.phpunit.xml
          docker exec php82-nginx DB_CONNECTION=pgsql DB_HOST=pgsql TENANCY_SYSTEM_CONNECTION_NAME=pgsql ./vendor/bin/phpunit -c ci.phpunit.xml
          docker exec php82-nginx DB_CONNECTION=pgsql DB_HOST=pgsql TENANCY_SYSTEM_CONNECTION_NAME=pgsql TENANCY_DATABASE_DIVISION_MODE=schema ./vendor/bin/phpunit -c ci.phpunit.xml ./tests/unit-tests/Database/ConnectionTest.php
      - name: Tear down Docker Compose
