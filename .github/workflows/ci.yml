  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Docker Compose
        run: docker compose -f docker-compose.yml up -d php81-apache
      - name: Install Composer dependencies
        run: docker exec php81-apache composer install -n --prefer-dist --no-progress -o
      - name: Run tests with coverage
        run: |
          docker exec php81-apache sleep 10
          docker exec php81-apache mysql --host=mariadb -e "grant all privileges on *.* to 'testing'@'%' with grant option;"
          docker exec php81-apache DB_CONNECTION=mysql DB_HOST=mariadb TENANCY_SYSTEM_CONNECTION_NAME=mysql ./vendor/bin/phpunit -c ci.phpunit.xml --coverage-clover=coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
      - name: Tear down Docker Compose
        run: docker compose -f docker-compose.yml down
